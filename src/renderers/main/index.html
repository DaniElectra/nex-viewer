<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>NEX Viewer</title>
		<link rel="stylesheet" href="assets/css/main.css">
		<link rel="stylesheet" href="assets/css/packets-section.css">
		<link rel="stylesheet" href="assets/css/packet-details-section.css">
		<link rel="stylesheet" href="assets/css/connections-list-section.css">
	</head>
	<body>
		<div class="content-wrapper">
			<section id="header">
				<span id="header-title" class="no-select">NEX Viewer</span>
				<input id="header-search" type="text" placeholder="Search...">
			</section>
			<main class="container">
				<section id="packets">
					<table id="packet-list">
						<thead>
							<tr>
								<th>Time</th>
								<th>Source</th>
								<th>Destination</th>
								<th>Version</th>
								<th>Info</th>
							</tr>
						</thead>
						<tbody></tbody>
					</table>
				</section>
				<div class="hr no-select"></div>
				<section id="packet-details"></section>
				<div class="vr no-select"></div>
				<section id="connections"></section>
			</main>
		</div>
		<script src="./assets/js/bundle.js"></script>
	</body>
</html>
